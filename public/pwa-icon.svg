<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="url(#emeraldGrad)" stroke-width="5" opacity="0.4"/>

  <!-- Qualitylinks Interlocking Q Ring emblem -->
  <g transform="translate(256, 230)">
    <!-- Main Outer Link Ring -->
    <path d="M -90,-80 A 90,90 0 1,1 -90,80 A 90,90 0 1,1 -90,-80 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="32" filter="url(#glow)"/>
    
    <!-- Secondary Interlocking Link Ring forming Qualitylinks 'Q' -->
    <path d="M 20,-20 A 70,70 0 1,1 80,60 L 120,100" fill="none" stroke="url(#cyanGrad)" stroke-width="28" stroke-linecap="round"/>

    <!-- Quality Spark Diamond at center top -->
    <path d="M 0,-130 L 16,-105 L 0,-80 L -16,-105 Z" fill="url(#goldGrad)"/>
    
    <!-- Inner Link Connecting Bar -->
    <path d="M -40,-30 L 40,30" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Text Badge Qualitylinks -->
  <text x="256" y="425" text-anchor="middle" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="900" font-size="38" letter-spacing="2">
    QUALITYLINKS
  </text>
  <text x="256" y="462" text-anchor="middle" fill="#10b981" font-family="'Cairo', sans-serif" font-weight="700" font-size="22" letter-spacing="1">
    كواليتي لينكس
  </text>
</svg>
