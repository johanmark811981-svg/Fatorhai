<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Building/Invoice Symbol Base -->
  <rect x="116" y="116" width="280" height="280" rx="36" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="12"/>

  <!-- Document Header lines -->
  <path d="M166 186 h180 M166 236 h120 M166 286 h150" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/>

  <!-- Checkmark Badge -->
  <circle cx="336" cy="326" r="48" fill="url(#accentGrad)"/>
  <path d="M312 326 l16 16 l32 -32" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold Star Accent -->
